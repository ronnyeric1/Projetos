<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletor de Cores</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="container">
        <h1>Seletor de Cores RGB</h1>
        <div class="color-preview"></div>
        <div class="sliders">
            <div class="slider-group">
                <label for="red">Vermelho (R):</label>
                <input type="range" id="red" min="0" max="255" value="255">
                <span id="redValue">255</span>
            </div>
            <div class="slider-group">
                <label for="green">Verde (G):</label>
                <input type="range" id="green" min="0" max="255" value="255">
                <span id="greenValue">255</span>
            </div>
            <div class="slider-group">
                <label for="blue">Azul (B):</label>
                <input type="range" id="blue" min="0" max="255" value="255">
                <span id="blueValue">255</span>
            </div>
        </div>
        <div class="color-code">Código RGB: <span id="rgbCode">rgb(255, 255, 255)</span></div>
    </div>

    <script src="./script/script.js"></script>
</body>
</html>
